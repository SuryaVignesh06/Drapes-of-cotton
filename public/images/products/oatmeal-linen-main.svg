<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="studioBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#F3F1EC"/>
      <stop offset="100%" stop-color="#ECEAE4"/>
    </radialGradient>
    <linearGradient id="fabricBase" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#E7DFD2"/>
      <stop offset="52%" stop-color="#D8CFC0"/>
      <stop offset="100%" stop-color="#C7BCA9"/>
    </linearGradient>
    <linearGradient id="foldHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="70%" stop-color="#1A1A18" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="cottonSlub" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 3H12M0 9H12M4 0V12M10 0V12" stroke="#1A1A18" stroke-width="0.45" stroke-opacity="0.14"/>
    </pattern>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1A1A18" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="600" height="750" fill="url(#studioBg)"/>
  
    <g filter="url(#softShadow)">
      <!-- Graceful studio-folded cotton saree silhouette -->
      <path d="M165 110 C165 92, 180 82, 200 82 L400 82 C420 82, 435 92, 435 110 L462 595 C463 614, 448 628, 428 628 L172 628 C152 628, 137 614, 138 595 Z" fill="url(#fabricBase)"/>
